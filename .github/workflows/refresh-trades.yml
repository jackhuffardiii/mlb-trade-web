name: Refresh trade data

on:
  schedule:
    # Deliberately off the top of the hour. GitHub's shared scheduler is most
    # congested at :00, and every run under "0 11 * * *" fired 1-2h late.
    - cron: "23 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-trades
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Trades ~90s + players ~10s (batched) + savant ~7s.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Snapshot current dataset
        run: cp public/data/trades.json "$RUNNER_TEMP/trades-before.json"

      - name: Fetch latest trades
        run: node scripts/fetch-trades.mjs

      - name: Diff against previous snapshot
        id: diff
        run: node scripts/diff-trades.mjs "$RUNNER_TEMP/trades-before.json" public/data/trades.json

      - name: Write job summary
        if: always()
        run: |
          echo "### Trade data refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.diff.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Discard timestamp-only churn
        if: steps.diff.outputs.changed != 'true'
        run: git checkout -- public/data/trades.json

      # Runs every day regardless of whether any trade happened -- player stats
      # move on days the transaction wire is silent. Not gated on the trades
      # diff for exactly that reason. Reads the (now current) trades.json for its
      # candidate list, so it has to follow the trade fetch.
      - name: Refresh player season data
        run: node scripts/fetch-players.mjs

      # 24 bulk CSVs, one per season per player type. Cheap regardless.
      - name: Refresh Savant percentiles
        run: node scripts/fetch-savant.mjs

      # Both files stamp `generated` with today's date whether or not any data
      # moved, so committing them blind would push a multi-megabyte diff every
      # single day for nothing. Same trap trades.json hit in d049da7; the diff
      # here is line-based rather than a bespoke script because these files are
      # pretty-printed and one grep is enough.
      - name: Discard timestamp-only churn in derived data
        run: |
          for f in public/data/players.json public/data/savant.json; do
            real=$(git diff --unified=0 -- "$f" \
              | grep -E '^[+-]' \
              | grep -vE '^(\+\+\+|---)' \
              | grep -v '"generated"' \
              | head -1)
            if [ -z "$real" ]; then
              echo "$f: timestamp only, discarding"
              git checkout -- "$f"
            else
              echo "$f: real changes, keeping"
            fi
          done

      - name: Commit and push updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/trades.json public/data/players.json public/data/savant.json
          if git diff --cached --quiet; then
            echo "Nothing changed in any dataset."
            exit 0
          fi
          git diff --cached --stat
          # The trades summary describes trades only. Reusing it verbatim
          # produced commits reading "Refresh data: no changes" that carried
          # 5,000 lines of moved player stats, which is worse than no message.
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            msg="${{ steps.diff.outputs.summary }}"
          else
            msg="player and Savant data only, no trades"
          fi
          git commit -m "Refresh data: $msg"
          git push origin main

      # GitHub only emails about a failed run if the ACCOUNT-level Actions
      # notification preference is on, and that preference is not reachable from
      # the API. An issue is. Repo owners are notified about issues in their own
      # repo by default, so this delivers the mail without depending on a
      # setting this workflow cannot see or change.
      #
      # Note the residual gap: this only fires when the job RUNS and fails. A run
      # that never happens -- a GitHub Actions outage, or the 60-day inactivity
      # disable -- is still silent. Catching that needs a check that lives
      # somewhere other than this workflow.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --label refresh-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            # One issue per outage, not one per day.
            gh issue comment "$open" --body "Failed again on $(date -u '+%Y-%m-%d %H:%M UTC'): $RUN_URL"
          else
            gh issue create \
              --title "Daily data refresh is failing" \
              --label refresh-failure \
              --body "The refresh workflow failed on $(date -u '+%Y-%m-%d %H:%M UTC').

          Run: $RUN_URL

          This issue closes itself on the next successful run, and collects a comment per
          failure until then. If the failing step is \`Set up job\`, it is usually a GitHub
          Actions outage rather than anything in this repo."
          fi

      - name: Clear failure report
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label refresh-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Green again: $RUN_URL"
          done
