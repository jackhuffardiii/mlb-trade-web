<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Trade Web — Every MLB trade, 2015–present</title>
    <meta
      name="description"
      content="An interactive graph of every Major League Baseball trade since 2015: the league-wide trade web, player-for-player chains, and team-by-team flows."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06070a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306070a'/%3E%3Cg stroke='%23e8b44c' stroke-width='1.1' fill='none'%3E%3Cline x1='16' y1='16' x2='6' y2='8'/%3E%3Cline x1='16' y1='16' x2='26' y2='9'/%3E%3Cline x1='16' y1='16' x2='9' y2='25'/%3E%3Cline x1='16' y1='16' x2='25' y2='24'/%3E%3C/g%3E%3Cg fill='%23ece8e0'%3E%3Ccircle cx='16' cy='16' r='3.4'/%3E%3Ccircle cx='6' cy='8' r='2'/%3E%3Ccircle cx='26' cy='9' r='2'/%3E%3Ccircle cx='9' cy='25' r='2'/%3E%3Ccircle cx='25' cy='24' r='2'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <div class="atmosphere" aria-hidden="true"></div>

      <main class="stage">
        <section id="view-web" class="view" data-view="web" aria-label="Trade Web"></section>
        <section id="view-chain" class="view" data-view="chain" aria-label="Chain Explorer"></section>
        <section
          id="view-flows"
          class="view scrolls"
          data-view="flows"
          aria-label="Team Flows"
        ></section>
      </main>

      <header class="chrome">
        <div class="masthead">
          <div class="nameplate">
            <h1><span class="the">The</span>Trade Web</h1>
            <p class="dateline">
              <span>Every MLB trade, 2015–present</span>
              <span class="sep">/</span>
              <span id="dateline-edition">—</span>
              <span class="sep sep-counts">/</span>
              <span id="dateline-counts">—</span>
            </p>
          </div>

          <div class="nav-cluster">
            <div class="history" role="group" aria-label="Navigation history">
              <button
                class="hist-btn"
                id="hist-back"
                type="button"
                aria-label="Back"
                title="Back (Alt+←)"
                disabled
              >
                ‹
              </button>
              <button
                class="hist-btn"
                id="hist-fwd"
                type="button"
                aria-label="Forward"
                title="Forward (Alt+→)"
                disabled
              >
                ›
              </button>
            </div>

            <nav class="sections" role="tablist" aria-label="Views">
              <button class="tab" role="tab" data-tab="web" aria-selected="true">
                <span class="numeral">I</span>Trade Web
              </button>
              <button class="tab" role="tab" data-tab="chain" aria-selected="false">
                <span class="numeral">II</span>Chain Explorer
              </button>
              <button class="tab" role="tab" data-tab="flows" aria-selected="false">
                <span class="numeral">III</span>Team Flows
              </button>
            </nav>
          </div>
        </div>

        <div class="strip">
          <div class="search">
            <input
              id="search"
              class="search-input"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Search a player or club"
              aria-label="Search a player or club"
              aria-expanded="false"
              role="combobox"
              aria-controls="results"
            />
            <span class="search-key" aria-hidden="true">/</span>
            <div id="results" class="results" role="listbox"></div>
          </div>

          <div class="years">
            <span class="strip-label">Seasons</span>
            <span class="year-readout" id="year-readout">2015–2026</span>
            <div class="slider" id="year-slider">
              <div class="slider-track"></div>
              <div class="slider-fill" id="year-fill"></div>
              <input type="range" id="year-min" aria-label="Earliest season" />
              <input type="range" id="year-max" aria-label="Latest season" />
            </div>
          </div>

          <div class="teams-rail" id="teams-rail" role="group" aria-label="Filter by club"></div>
          <button class="clear-filter" id="clear-filter" type="button">Clear club</button>
        </div>
      </header>

      <aside class="panel" id="panel" aria-live="polite" aria-label="Details">
        <div class="panel-head">
          <div class="panel-head-text">
            <div class="panel-kicker" id="panel-kicker"></div>
            <h2 class="panel-title" id="panel-title"></h2>
            <div class="panel-sub" id="panel-sub"></div>
          </div>
          <button class="panel-close" id="panel-close" type="button" aria-label="Close">✕</button>
        </div>
        <div class="panel-body" id="panel-body"></div>
      </aside>

      <footer class="colophon">
        <span>Data: MLB Stats API · unaffiliated with MLB</span>
        <span>
          Built by Jack Huffard ·
          <a href="https://github.com/jackhuffardiii" target="_blank" rel="noopener noreferrer"
            >github.com/jackhuffardiii</a
          >
        </span>
      </footer>

      <div class="boot" id="boot">
        <div class="boot-inner">
          <div class="boot-mark">The Trade Web</div>
          <div class="boot-bar"><i></i></div>
          <div class="boot-msg" id="boot-msg">Loading transactions</div>
        </div>
      </div>

      <div class="tip" id="tip" role="tooltip"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
